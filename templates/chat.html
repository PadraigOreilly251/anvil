<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anvil</title>
<script src="/static/marked.min.js"></script>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1e2230; --border: #2a2f3d;
  --text: #d8dce6; --dim: #8a93a6; --accent: #5b8cff; --ok: #4ecf7a;
  --warn: #f0b429; --err: #f06a6a; --chip: #232a3b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: 1px; color: var(--accent); }
select, input[type="number"] {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 13px;
}
.badge {
  font-size: 10px; padding: 2px 7px; border-radius: 9px;
  background: var(--chip); color: var(--dim); border: 1px solid var(--border);
}
.mcp-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  background: var(--chip); border: 1px solid var(--border);
  padding: 4px 9px; border-radius: 12px; cursor: pointer; user-select: none;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.dot.on { background: var(--ok); }
.dot.off { background: var(--err); }
label.tools-toggle { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--dim); cursor: pointer; }
.spacer { flex: 1; }
button {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.danger:hover { border-color: var(--err); color: var(--err); }
.ctx-meter { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.ctx-bar { width: 90px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.ctx-fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
.ctx-fill.warn { background: var(--warn); }
.ctx-fill.hot { background: var(--err); }
main { flex: 1; overflow-y: auto; padding: 18px; }
.chat { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg .who { font-size: 11px; color: var(--dim); }
.msg .body {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; overflow-wrap: anywhere;
}
.msg.user .body { background: var(--panel2); }
.msg .body img { max-width: 100%; border-radius: 6px; margin: 4px 0; }
.msg .body pre { background: #0b0d12; border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 12.5px; }
.msg .body code { font-family: ui-monospace, monospace; }
.msg .body :not(pre) > code { background: #0b0d12; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.toolchip {
  font-size: 12px; background: var(--chip); border: 1px solid var(--border);
  border-radius: 14px; padding: 4px 10px; color: var(--dim);
  display: inline-flex; gap: 6px; align-items: center; margin: 3px 0;
  max-width: 100%; overflow-wrap: anywhere;
}
.toolchip .tname { color: var(--accent); }
.compact-note { font-size: 11px; color: var(--warn); }
footer {
  background: var(--panel); border-top: 1px solid var(--border); padding: 12px 14px;
}
.composer { max-width: 880px; margin: 0 auto; }
.attach-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.attach-row .thumb { position: relative; }
.attach-row .thumb img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.attach-row .thumb .x {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--err); color: #fff; border: none;
  font-size: 11px; line-height: 20px; padding: 0;
}
.attach-row .filechip {
  background: var(--chip); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; display: flex; gap: 8px; align-items: center;
}
input[type="file"] { display: none; }
textarea {
  width: 100%; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font: inherit; resize: vertical; min-height: 46px; max-height: 200px;
}
.composer-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.composer-row .hint { font-size: 11px; color: var(--dim); }
#toast {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 9;
}
#toast.err { border-color: var(--err); }
#toast.ok { border-color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>⚒ ANVIL</h1>
  <select id="model-select" title="Model"></select>
  <select id="think-select" title="Thinking intensity (high = server default / max)">
    <option value="off">think: off</option>
    <option value="low" selected>think: low</option>
    <option value="medium">think: medium</option>
    <option value="high">think: high</option>
  </select>
  <span id="modality-badge" class="badge">text</span>
  <span class="spacer"></span>
  <span id="mcp-chips"></span>
  <label class="tools-toggle"><input type="checkbox" id="tools-toggle"> MCP tools</label>
  <div class="ctx-meter">
    <div class="ctx-bar"><div class="ctx-fill" id="ctx-fill"></div></div>
    <span id="ctx-label">0%</span>
  </div>
  <button id="btn-compact" title="Compact conversation history now">🗜 Compact</button>
  <button id="btn-reset" class="danger" title="Clear conversation">↺ Reset</button>
</header>

<main>
  <div class="chat" id="chat"></div>
</main>

<footer>
  <div class="composer">
    <div class="attach-row" id="attach-row"></div>
    <div class="composer-row">
      <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="btn-attach" title="Attach media">📎</button>
      <input type="file" id="file-input" multiple
             accept="image/*,video/*,audio/*,.pdf,.txt,.md,.csv,.json,.py,.ts,.js">
      <button id="btn-send">Send ➤</button>
    </div>
  </div>
</footer>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const chatEl = $("chat");
let models = [];
let currentModel = null;
let busy = false;
let pendingMedia = [];  // upload records

function toast(msg, cls = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = cls;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 3500);
}

function setCtx(est, ctx) {
  const pct = ctx ? Math.min(100, Math.round(100 * est / ctx)) : 0;
  const fill = $("ctx-fill");
  fill.style.width = pct + "%";
  fill.className = "ctx-fill" + (pct > 90 ? " hot" : pct > 70 ? " warn" : "");
  $("ctx-label").textContent = pct + "%";
}

async function loadModels() {
  const r = await fetch("/api/models");
  models = (await r.json()).models;
  const sel = $("model-select");
  sel.innerHTML = "";
  for (const m of models) {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.name + (m.input.includes("image") ? " 🖼" : "");
    sel.appendChild(o);
  }
  if (models.length) {
    const def = models[0];
    sel.value = def.id;
    selectModel(def);
  }
}

function selectModel(m) {
  currentModel = m;
  $("modality-badge").textContent = m.input.join("+");
  // default: MCP tools ON for tool-capable models (user can override)
  $("tools-toggle").checked = m.tools === true;
}

async function loadMcpStatus() {
  const r = await fetch("/api/status");
  const st = (await r.json()).mcp;
  const wrap = $("mcp-chips");
  wrap.innerHTML = "";
  for (const [name, s] of Object.entries(st)) {
    const chip = document.createElement("span");
    chip.className = "mcp-chip";
    chip.title = s.ok ? s.names.join(", ") : (s.reason || "");
    chip.innerHTML = `<span class="dot ${s.ok ? "on" : "off"}"></span>${name} (${s.ok ? s.tools + " tools" : "down"})`;
    wrap.appendChild(chip);
  }
}

function addMsg(role, html) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = `<span class="who">${role === "user" ? "you" : (role === "tool" ? "tool" : "assistant")}</span><div class="body"></div>`;
  const body = d.querySelector(".body");
  if (role === "user") body.innerHTML = html;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return body;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMd(body, text) {
  if (window.marked) body.innerHTML = marked.parse(text);
  else body.textContent = text;
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  return r.json();
}

function refreshAttachRow() {
  const row = $("attach-row");
  row.innerHTML = "";
  pendingMedia.forEach((m, i) => {
    if (m.mime.startsWith("image/") && m.data_uri) {
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<img src="${m.data_uri}"><button class="x" title="remove">✕</button>`;
      d.querySelector(".x").onclick = () => { pendingMedia.splice(i, 1); refreshAttachRow(); };
      row.appendChild(d);
    } else {
      const d = document.createElement("div");
      d.className = "filechip";
      d.innerHTML = `📄 ${esc(m.name)} <button class="x" style="border:none;background:none;color:var(--err);cursor:pointer" title="remove">✕</button>`;
      d.querySelector("button").onclick = () => { pendingMedia.splice(i, 1); refreshAttachRow(); };
      row.appendChild(d);
    }
  });
}

$("btn-attach").onclick = () => $("file-input").click();
$("file-input").onchange = async (e) => {
  for (const f of e.target.files) {
    toast("uploading " + f.name + "…");
    try {
      const rec = await uploadFile(f);
      pendingMedia.push(rec);
      toast("attached " + rec.name, "ok");
    } catch (err) { toast("upload failed: " + err, "err"); }
  }
  e.target.value = "";
  refreshAttachRow();
};

async function send() {
  if (busy || !currentModel) return;
  const text = $("input").value.trim();
  if (!text && !pendingMedia.length) return;
  busy = true;
  $("btn-send").disabled = true;

  const userHtml = esc(text).replace(/\n/g, "<br>") +
    pendingMedia.filter(m => m.mime.startsWith("image/") && m.data_uri)
      .map(m => `<br><img src="${m.data_uri}">`).join("") +
    pendingMedia.filter(m => !m.mime.startsWith("image/"))
      .map(m => `<br>📄 ${esc(m.name)}`).join("");
  addMsg("user", userHtml);
  $("input").value = "";

  const mediaIds = pendingMedia.map(m => m.id);
  pendingMedia = [];
  refreshAttachRow();

  const body = addMsg("assistant", "");
  let md = "";
  let raw = "";
  const toolsOn = $("tools-toggle").checked;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: currentModel.id,
      message: text,
      media: mediaIds,
      tools: toolsOn,
      thinking: $("think-select").value,
    }),
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let pendingTools = "";

  const flushTools = () => {
    if (pendingTools) {
      const wrap = document.createElement("div");
      wrap.innerHTML = pendingTools;
      body.after(wrap);
      pendingTools = "";
    }
  };

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = "token", data = {};
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) {
            try { data = JSON.parse(line.slice(5).trim()); } catch {}
          }
        }
        if (ev === "token") {
          raw += data.t || "";
          md = raw;
          renderMd(body, md);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "tool_call") {
          pendingTools += `<span class="toolchip">🔧 <span class="tname">${esc(data.name)}</span> ${esc((data.args || "").slice(0, 120))}</span>`;
          flushTools();
        } else if (ev === "tool_result") {
          pendingTools += `<span class="toolchip">✓ ${esc(data.name)}: ${esc((data.preview || "").slice(0, 160))}</span>`;
          flushTools();
        } else if (ev === "compacted") {
          pendingTools += `<span class="toolchip compact-note">🗜 compacted (round ${data.n}) — context now ~${Math.round(data.est / currentModel.context_window * 100)}%</span>`;
          flushTools();
          setCtx(data.est, currentModel.context_window);
        } else if (ev === "status") {
          body.insertAdjacentHTML("beforeend", `<div class="compact-note">${esc(data.status || "…")}</div>`);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (ev === "done") {
          setCtx(data.est, data.ctx);
        } else if (ev === "error") {
          pendingTools += `<span class="toolchip compact-note" style="color:var(--err)">⚠ ${esc(data.error || "error")}</span>`;
          flushTools();
        }
      }
    }
  } catch (e) {
    toast("stream error: " + e, "err");
  }
  if (!raw) renderMd(body, "_no response_");
  busy = false;
  $("btn-send").disabled = false;
}

$("btn-send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("model-select").onchange = (e) => {
  const m = models.find(x => x.id === e.target.value);
  if (m) selectModel(m);
};
$("tools-toggle").onchange = loadMcpStatus;

$("btn-reset").onclick = async () => {
  await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  chatEl.innerHTML = "";
  pendingMedia = [];
  refreshAttachRow();
  setCtx(0, currentModel ? currentModel.context_window : 0);
  toast("conversation reset", "ok");
};

$("btn-compact").onclick = async () => {
  if (!currentModel) return;
  toast("compacting…");
  try {
    const r = await fetch("/api/compact", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: currentModel.id }),
    });
    const j = await r.json();
    toast(j.ok ? `compacted (round ${j.compactions}, ~${j.est} tok)` : "nothing to compact yet", j.ok ? "ok" : "err");
    if (j.ok) setCtx(j.est, currentModel.context_window);
  } catch (e) { toast("compact failed: " + e, "err"); }
};

loadModels().then(loadMcpStatus);
setInterval(loadMcpStatus, 30000);
</script>
</body>
</html>
